# =============================================================
# KION Analytics — local stack: LibreChat + MongoDB + Superset
#   LibreChat UI : http://localhost:3080
#   Superset UI  : http://localhost:8088  (admin / admin by default)
# ClickHouse itself runs in ClickHouse Cloud (see clickhouse/*.sql)
# =============================================================

services:
  # ---------------- LibreChat ----------------
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: unless-stopped
    ports:
      - "3080:3080"
    depends_on:
      mongodb:
        condition: service_healthy
      mcp-clickhouse:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      SEARCH: "false"            # skip meilisearch for the hackathon
      ALLOW_REGISTRATION: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_KEY: ${OPENROUTER_KEY:-}
      GOOGLE_KEY: ${GOOGLE_KEY:-}
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/images

  mongodb:
    image: mongo:6
    container_name: librechat-mongo
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  # ---------------- ClickHouse MCP server (for LibreChat agents) ----------------
  # Official mcp-clickhouse (PyPI) in HTTP transport; LibreChat connects to it
  # via mcpServers in librechat/librechat.yaml.
  mcp-clickhouse:
    build: ./mcp-clickhouse
    image: kion/mcp-clickhouse:local
    container_name: mcp-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: ${CH_HOST}
      CLICKHOUSE_PORT: "8443"
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
      CLICKHOUSE_SECURE: "true"
      CLICKHOUSE_DATABASE: kion
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_AUTH_DISABLED: "true"
      CLICKHOUSE_MCP_QUERY_TIMEOUT: "60"

  # ---------------- Superset ----------------
  superset:
    build: ./superset
    image: kion/superset:local
    entrypoint: ["bash", "/bootstrap.sh"]
    container_name: superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-hackathon-change-me}
      ADMIN_USERNAME: ${SUPERSET_ADMIN:-admin}
      ADMIN_PASSWORD: ${SUPERSET_PASSWORD:-admin}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/bootstrap.sh:/bootstrap.sh:ro

volumes:
  mongo_data:
  librechat_images:
  superset_home:
